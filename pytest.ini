[pytest]
# Rend le package `app` importable depuis les tests sans installation.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Tests DB async à venir (Crédit / Gains) — évite le warning de scope.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
